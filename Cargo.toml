[workspace]
resolver = "2"
members = [
  "crates/common",
  "services/api-gateway",
  "services/academic-service",
  "services/admissions-service",
  "services/financial-service",
  "services/hospital-service",
  "services/ai-secops-service",
  "services/survey-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Abdullahi Baba Garba <lead@newgate-university.edu.ng>"]
license = "Proprietary"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
common = { path = "crates/common" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal"] }
redis = { version = "0.27", features = ["tokio-comp"] }
lapin = "2"
dotenvy = "0.15"
base64 = "0.22"
